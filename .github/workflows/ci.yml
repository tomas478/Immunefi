name: CI

on:
  push:
    branches: [main, "feat/**", "cursor/**"]
  pull_request:

jobs:
  foundry:
    name: forge test (evm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge test -vv
        env:
          # Fork tests skip when unset — Smoke.t.sol still passes
          ETH_RPC_URL: ""

  anchor-build:
    name: anchor build (solana)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4
      - uses: metadaoproject/setup-anchor@v3.1
        with:
          anchor-version: "0.30.1"
          solana-cli-version: "1.18.26"
          node-version: "20.16.0"
      - run: solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json || true
      - run: anchor build