name: CI

on:
  push:
    branches: [main, "feat/**", "cursor/**", "fix/**"]
  pull_request:

jobs:
  foundry:
    name: forge test (evm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge test -vv
        env:
          # Fork tests skip when unset — Smoke.t.sol still passes
          ETH_RPC_URL: ""

  anchor-build:
    name: anchor build (solana)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.16.0"
      - run: npm i -g @coral-xyz/anchor-cli@0.30.1
      - name: Install Solana CLI (Anza)
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Verify Solana toolchain
        run: |
          solana --version
          cargo-build-sbf --version
      - run: solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json --force
      # IDL build needs host proc-macro tooling; --no-idl validates the on-chain program compile.
      - run: anchor build --no-idl